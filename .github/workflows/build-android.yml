name: Build BalkanRoute Android 17 APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 3. Generate Android 17 Project, Fix Map & Material 3 UI
        shell: python
        run: |
          import os, re, shutil

          base = "android_build"
          assets = f"{base}/app/src/main/assets"
          java = f"{base}/app/src/main/java/com/balkanroute/app"
          res_val = f"{base}/app/src/main/res/values"
          res_drw = f"{base}/app/src/main/res/drawable"
          res_mip = f"{base}/app/src/main/res/mipmap-anydpi-v26"

          for d in [assets, java, res_val, res_drw, res_mip]:
              os.makedirs(d, exist_ok=True)

          for item in os.listdir("."):
              if item not in [base, ".git", ".github"] and os.path.isfile(item):
                  shutil.copy2(item, os.path.join(assets, item))

          # 1. Переписываем sw.js так, чтобы он не сбрасывал тайлы в Response.error() в WebView
          sw_code = '''const V='balk-shell-v8',RT='tiles-rt',PRE='tiles-pre';
          self.addEventListener('install',e=>{self.skipWaiting()});
          self.addEventListener('activate',e=>{e.waitUntil(caches.keys().then(ks=>Promise.all(ks.filter(k=>k.startsWith('balk-shell')&&k!==V).map(k=>caches.delete(k)))).then(()=>self.clients.claim()))});
          const tileKey=u=>{let st=null;if(/(^|\\.)tile\\.openstreetmap\\.org$/.test(u.hostname))st='osm';else if(/basemaps\\.cartocdn\\.com$/.test(u.hostname))st=/dark_all/.test(u.pathname)?'dark':'voy';if(!st)return null;
            const m=u.pathname.match(/\\/(\\d+)\\/(\\d+)\\/(\\d+)(?:@2x)?\\.png$/);return m?{st,z:m[1],x:m[2],y:m[3],id:`https://t.local/${st}/${m[1]}/${m[2]}/${m[3]}`}:null};
          async function tile(e,k){
            try {
              const [pre,rt]=await Promise.all([caches.open(PRE),caches.open(RT)]);
              const hit=await pre.match(k.id)||await rt.match(k.id);
              if(hit) return hit;
            } catch(err){}
            return fetch(e.request);
          }
          self.addEventListener('fetch',e=>{
            const q=e.request;if(q.method!=='GET'||q.cache==='no-store')return;
            const u=new URL(q.url);
            const k=tileKey(u);
            if(k){e.respondWith(tile(e,k));return}
          });
          '''
          with open(f"{assets}/sw.js", "w", encoding="utf-8") as f:
              f.write(sw_code)

          # 2. Патчим index.html: исправляем рендеринг тайлов, отступы статус-бара и добавляем стиль Material 3 Expressive
          idx = f"{assets}/index.html"
          with open(idx, "r", encoding="utf-8") as f:
              html = f.read()

          html = re.sub(r'<script[^>]*local\.adguard\.org[^>]*></script>', '', html)
          html = re.sub(r'env\(\s*safe-area-inset-top\s*(?:,[^)]+)?\)', 'var(--safe-top, 38px)', html)
          html = re.sub(r'env\(\s*safe-area-inset-bottom\s*(?:,[^)]+)?\)', 'var(--safe-bottom, 22px)', html)
          html = re.sub(r'env\(\s*safe-area-inset-left\s*(?:,[^)]+)?\)', 'var(--safe-left, 0px)', html)
          html = re.sub(r'env\(\s*safe-area-inset-right\s*(?:,[^)]+)?\)', 'var(--safe-right, 0px)', html)

          patch = '''<style id="android17-material3-upgrade">
          :root {
            --safe-top: 38px;
            --safe-bottom: 22px;
            --safe-left: 0px;
            --safe-right: 0px;
            --m3-spring: cubic-bezier(0.22, 1.25, 0.36, 1);
          }
          * { -webkit-tap-highlight-color: transparent; }
          html, body { overscroll-behavior: none; }

          /* Исправление белого поля вместо карты в Android WebView */
          .leaflet-container img.leaflet-tile {
            mix-blend-mode: normal !important;
            filter: none !important;
          }
          .leaflet-tile-pane {
            z-index: 200 !important;
            opacity: 1 !important;
          }

          /* Верхний защитный градиент под прозрачный статус-бар Android 17 */
          body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; right: 0;
            height: calc(var(--safe-top, 38px) + 10px);
            background: linear-gradient(to bottom, rgba(243,242,242,0.88) 35%, rgba(243,242,242,0));
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 9998;
            pointer-events: none;
          }
          [data-theme="dark"] body::before {
            background: linear-gradient(to bottom, rgba(28,25,23,0.88) 35%, rgba(28,25,23,0));
          }

          /* Пружинная физика Material 3 Expressive для интерактивных элементов */
          button, .btn, [role="button"], .leaflet-marker-icon {
            transition: transform 0.22s var(--m3-spring), box-shadow 0.2s ease, background-color 0.2s ease !important;
          }
          button:active, .btn:active, [role="button"]:active {
            transform: scale(0.94) !important;
          }

          /* Копирайт карты аккуратно сбоку, чтобы не перекрывался полосой жестов */
          .leaflet-control-attribution {
            font-size: 9px !important;
            opacity: 0.65;
            border-radius: 8px !important;
            margin-bottom: calc(var(--safe-bottom, 22px) + 4px) !important;
            margin-right: 8px !important;
            padding: 2px 6px !important;
            backdrop-filter: blur(6px);
          }
          </style>
          <script>
          (function(){
            // Принудительное обновление Service Worker и очистка старого сломанного воркера v5
            if ('serviceWorker' in navigator) {
              navigator.serviceWorker.getRegistrations().then(regs => {
                regs.forEach(r => r.update());
              });
            }

            const syncTheme = () => {
              const t = window.__thm ? window.__thm.get() : document.documentElement.dataset.theme;
              if (window.AndroidBridge && window.AndroidBridge.onThemeChanged) {
                window.AndroidBridge.onThemeChanged(t || "light");
              }
            };
            window.addEventListener("themechange", syncTheme);

            // Нативный тактильный отклик при нажатии на кнопки и пины
            document.addEventListener("pointerdown", (e) => {
              const t = e.target.closest('button, a, .btn, [role="button"], .leaflet-marker-icon, .seg-opt');
              if (t && window.AndroidBridge && window.AndroidBridge.haptic) {
                window.AndroidBridge.haptic();
              }
            }, { passive: true });

            window.addEventListener("DOMContentLoaded", () => {
              syncTheme();
            });
          })();
          </script>'''

          html = html.replace("</head>", patch + "\n</head>", 1)
          with open(idx, "w", encoding="utf-8") as f:
              f.write(html)

          # 3. Иконки приложения
          with open(f"{res_drw}/ic_bg.xml", "w", encoding="utf-8") as f:
              f.write('<vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108"><path android:fillColor="#D0603F" android:pathData="M0,0h108v108h-108z"/><path android:fillColor="#B84324" android:pathData="M0,68 C36,56 72,80 108,64 L108,108 L0,108 Z"/></vector>')

          with open(f"{res_drw}/ic_fg.xml", "w", encoding="utf-8") as f:
              f.write('<vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108"><path android:fillColor="#F8F4F4" android:pathData="M24,72 L44,38 L58,60 L66,46 L84,72 Z"/><path android:strokeColor="#D0603F" android:strokeWidth="4.5" android:strokeLineCap="round" android:pathData="M44,73 Q53,62 47,54 Q42,47 52,40"/><path android:fillColor="#FFE0D9" android:pathData="M66,30 C61.5,30 58,33.5 58,38 C58,44 66,52 66,52 C66,52 74,44 74,38 C74,33.5 70.5,30 66,30 Z"/></vector>')

          ic_xml = '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@drawable/ic_bg"/><foreground android:drawable="@drawable/ic_fg"/><monochrome android:drawable="@drawable/ic_fg"/></adaptive-icon>'
          with open(f"{res_mip}/ic_launcher.xml", "w", encoding="utf-8") as f: f.write(ic_xml)
          with open(f"{res_mip}/ic_launcher_round.xml", "w", encoding="utf-8") as f: f.write(ic_xml)

          # 4. Конфигурация Gradle
          with open(f"{base}/settings.gradle.kts", "w", encoding="utf-8") as f:
              f.write('pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }\ndependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }\nrootProject.name = "BalkanRoute"\ninclude(":app")\n')

          with open(f"{base}/gradle.properties", "w", encoding="utf-8") as f:
              f.write("android.useAndroidX=true\norg.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8\n")

          with open(f"{base}/build.gradle.kts", "w", encoding="utf-8") as f:
              f.write('plugins {\n id("com.android.application") version "8.7.3" apply false\n id("org.jetbrains.kotlin.android") version "2.0.21" apply false\n}\n')

          with open(f"{base}/app/build.gradle.kts", "w", encoding="utf-8") as f:
              f.write('plugins {\n id("com.android.application")\n id("org.jetbrains.kotlin.android")\n}\nandroid {\n namespace = "com.balkanroute.app"\n compileSdk = 35\n defaultConfig {\n applicationId = "com.balkanroute.app"\n minSdk = 29\n targetSdk = 35\n versionCode = 5\n versionName = "1.4.0"\n }\n buildTypes {\n release {\n isMinifyEnabled = false\n signingConfig = signingConfigs.getByName("debug")\n }\n }\n compileOptions {\n sourceCompatibility = JavaVersion.VERSION_17\n targetCompatibility = JavaVersion.VERSION_17\n }\n kotlinOptions { jvmTarget = "17" }\n}\ndependencies {\n implementation("androidx.core:core-ktx:1.15.0")\n implementation("androidx.activity:activity-ktx:1.10.0")\n implementation("androidx.webkit:webkit:1.12.1")\n}\n')

          with open(f"{res_val}/themes.xml", "w", encoding="utf-8") as f:
              f.write('<resources><style name="Theme.BalkanRoute" parent="android:Theme.Material.NoActionBar"><item name="android:statusBarColor">@android:color/transparent</item><item name="android:navigationBarColor">@android:color/transparent</item><item name="android:enforceStatusBarContrast">false</item><item name="android:enforceNavigationBarContrast">false</item><item name="android:windowLayoutInDisplayCutoutMode">shortEdges</item></style></resources>')

          with open(f"{base}/app/src/main/AndroidManifest.xml", "w", encoding="utf-8") as f:
              f.write('<manifest xmlns:android="http://schemas.android.com/apk/res/android"><uses-permission android:name="android.permission.INTERNET"/><uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/><uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/><uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/><application android:allowBackup="true" android:usesCleartextTraffic="true" android:hardwareAccelerated="true" android:enableOnBackInvokedCallback="true" android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher_round" android:label="Балканы" android:supportsRtl="true" android:theme="@style/Theme.BalkanRoute"><activity android:name=".MainActivity" android:configChanges="orientation|screenSize|screenLayout|keyboardHidden|uiMode" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>')

          # 5. Нативный код MainActivity с дисковым кэшем тайлов и авто-резервом CartoDB Voyager
          kt_code = '''package com.balkanroute.app

          import android.Manifest
          import android.annotation.SuppressLint
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.graphics.Color
          import android.net.Uri
          import android.os.Bundle
          import android.view.HapticFeedbackConstants
          import android.view.ViewGroup
          import android.webkit.*
          import androidx.activity.ComponentActivity
          import androidx.activity.OnBackPressedCallback
          import androidx.activity.SystemBarStyle
          import androidx.activity.enableEdgeToEdge
          import androidx.core.app.ActivityCompat
          import androidx.core.content.ContextCompat
          import androidx.core.view.ViewCompat
          import androidx.core.view.WindowCompat
          import androidx.core.view.WindowInsetsCompat
          import androidx.webkit.ServiceWorkerClientCompat
          import androidx.webkit.ServiceWorkerControllerCompat
          import androidx.webkit.WebViewAssetLoader
          import androidx.webkit.WebViewFeature
          import java.io.ByteArrayInputStream
          import java.io.File
          import java.net.HttpURLConnection
          import java.net.URL

          class MainActivity : ComponentActivity() {
              private lateinit var webView: WebView
              private lateinit var tileCacheDir: File
              private var sTop = 38; private var sBot = 22; private var sLeft = 0; private var sRight = 0
              private val tileRegex = Regex("/(\\\\d+)/(\\\\d+)/(\\\\d+)(?:@2x)?\\\\.png$")

              private fun downloadBytes(urlStr: String): ByteArray? {
                  return try {
                      val conn = (URL(urlStr).openConnection() as HttpURLConnection).apply {
                          requestMethod = "GET"
                          connectTimeout = 8000
                          readTimeout = 8000
                          setRequestProperty("User-Agent", "Mozilla/5.0 (Linux; Android 16; Pixel 9 Pro) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/131.0.0.0 Mobile Safari/537.36")
                          setRequestProperty("Accept", "image/avif,image/webp,image/apng,image/*,*/*;q=0.8")
                      }
                      conn.connect()
                      if (conn.responseCode == 200) {
                          val bytes = conn.inputStream.use { it.readBytes() }
                          if (bytes.size > 100) bytes else null
                      } else null
                  } catch (_: Exception) { null }
              }

              private fun handleReq(loader: WebViewAssetLoader, req: WebResourceRequest): WebResourceResponse? {
                  val u = req.url
                  val host = u.host ?: ""
                  val path = u.path ?: ""

                  if (host == "appassets.androidplatform.net") {
                      val fixed = if (path == "/assets/" || path == "/assets")
                          Uri.parse("https://appassets.androidplatform.net/assets/index.html") else u
                      return loader.shouldInterceptRequest(fixed)
                  }

                  if (host.endsWith("openstreetmap.org") || host.endsWith("cartocdn.com")) {
                      val m = tileRegex.find(path)
                      val style = when {
                          path.contains("dark_all") -> "dark"
                          host.endsWith("openstreetmap.org") -> "osm"
                          else -> "voy"
                      }
                      val respHeaders = mapOf(
                          "Access-Control-Allow-Origin" to "*",
                          "Access-Control-Allow-Methods" to "GET, OPTIONS",
                          "Cache-Control" to "public, max-age=2592000"
                      )

                      if (m != null) {
                          val (z, x, y) = m.destructured
                          val cacheFile = File(tileCacheDir, "${style}_${z}_${x}_${y}.png")
                          if (cacheFile.exists() && cacheFile.length() > 100) {
                              return try {
                                  WebResourceResponse("image/png", null, 200, "OK", respHeaders, ByteArrayInputStream(cacheFile.readBytes()))
                              } catch (_: Exception) { null }
                          }

                          // Скачиваем с основного сервера, а если OSM заблокировал VPN — автоматически берем тайл с CartoDB Voyager
                          var bytes = downloadBytes(u.toString())
                          if (bytes == null) {
                              val fallbackUrl = if (style == "dark")
                                  "https://a.basemaps.cartocdn.com/dark_all/$z/$x/$y@2x.png"
                              else
                                  "https://a.basemaps.cartocdn.com/rastertiles/voyager/$z/$x/$y@2x.png"
                              bytes = downloadBytes(fallbackUrl)
                          }

                          if (bytes != null) {
                              try { cacheFile.writeBytes(bytes) } catch (_: Exception) {}
                              return WebResourceResponse("image/png", null, 200, "OK", respHeaders, ByteArrayInputStream(bytes))
                          }
                      } else {
                          val bytes = downloadBytes(u.toString())
                          if (bytes != null) {
                              return WebResourceResponse("image/png", null, 200, "OK", respHeaders, ByteArrayInputStream(bytes))
                          }
                      }
                  }
                  return null
              }

              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  enableEdgeToEdge(
                      statusBarStyle = SystemBarStyle.auto(Color.TRANSPARENT, Color.TRANSPARENT),
                      navigationBarStyle = SystemBarStyle.auto(Color.TRANSPARENT, Color.TRANSPARENT)
                  )
                  super.onCreate(savedInstanceState)
                  WindowCompat.setDecorFitsSystemWindows(window, false)

                  tileCacheDir = File(filesDir, "tiles_cache").apply { mkdirs() }

                  if (ContextCompat.checkSelfPermission(this, Manifest.permission.ACCESS_FINE_LOCATION) != PackageManager.PERMISSION_GRANTED) {
                      ActivityCompat.requestPermissions(this, arrayOf(Manifest.permission.ACCESS_FINE_LOCATION), 101)
                  }

                  val loader = WebViewAssetLoader.Builder()
                      .setDomain("appassets.androidplatform.net")
                      .addPathHandler("/assets/", WebViewAssetLoader.AssetsPathHandler(this))
                      .build()

                  if (WebViewFeature.isFeatureSupported(WebViewFeature.SERVICE_WORKER_BASIC_USAGE)) {
                      ServiceWorkerControllerCompat.getInstance().setServiceWorkerClient(
                          object : ServiceWorkerClientCompat() {
                              override fun shouldInterceptRequest(req: WebResourceRequest) = handleReq(loader, req)
                          }
                      )
                  }

                  webView = WebView(this).apply {
                      layoutParams = ViewGroup.LayoutParams(-1, -1)
                      setBackgroundColor(Color.TRANSPARENT)
                      overScrollMode = WebView.OVER_SCROLL_NEVER
                      isVerticalScrollBarEnabled = false
                      isHorizontalScrollBarEnabled = false
                      settings.apply {
                          javaScriptEnabled = true
                          domStorageEnabled = true
                          databaseEnabl
