name: Build BalkanRoute APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate Android Project
        shell: python
        run: |
          import os, re, shutil
          b = "android_build"
          m = f"{b}/app/src/main"
          for d in [f"{m}/assets", f"{m}/java/com/balkanroute/app", f"{m}/res/values", f"{m}/res/drawable", f"{m}/res/mipmap-anydpi-v26"]:
              os.makedirs(d, exist_ok=True)
          for f in os.listdir("."):
              if f not in [b, ".git", ".github"] and os.path.isfile(f):
                  shutil.copy2(f, f"{m}/assets/{f}")

          p = f"{m}/assets/index.html"
          h = open(p, encoding="utf-8").read()
          h = re.sub(r'<script[^>]*local\.adguard\.org[^>]*></script>', '', h)
          h = re.sub(r'env\(\s*safe-area-inset-top\s*(?:,[^)]+)?\)', 'var(--safe-top, 38px)', h)
          h = re.sub(r'env\(\s*safe-area-inset-bottom\s*(?:,[^)]+)?\)', 'var(--safe-bottom, 22px)', h)

          fix = '''<style>
          :root{--safe-top:38px;--safe-bottom:22px;--m3-spring:cubic-bezier(0.22,1.25,0.36,1)}
          *{-webkit-tap-highlight-color:transparent}html,body{overscroll-behavior:none}
          .leaflet-container img.leaflet-tile{mix-blend-mode:normal!important;filter:none!important}
          body::before{content:"";position:fixed;top:0;left:0;right:0;height:calc(var(--safe-top,38px) + 8px);background:linear-gradient(to bottom,rgba(243,242,242,.88) 35%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:9998;pointer-events:none}
          [data-theme="dark"] body::before{background:linear-gradient(to bottom,rgba(28,25,23,.88) 35%,transparent)}
          button,.btn,[role="button"]{transition:transform .22s var(--m3-spring)!important}
          button:active,.btn:active,[role="button"]:active{transform:scale(.94)!important}
          .leaflet-control-attribution{margin-bottom:var(--safe-bottom,22px)!important;border-radius:8px!important;font-size:9px!important;opacity:.7}
          </style><script>
          (function(){
            const s=()=>{const t=window.__thm?window.__thm.get():document.documentElement.dataset.theme;if(window.AndroidBridge)window.AndroidBridge.onThemeChanged(t||"light")};
            addEventListener("themechange",s);addEventListener("DOMContentLoaded",s);
            addEventListener("pointerdown",e=>{if(e.target.closest('button,a,.btn,[role="button"],.leaflet-marker-icon')&&window.AndroidBridge)window.AndroidBridge.haptic()},{passive:true});
          })();
          </script>'''
          open(p, "w", encoding="utf-8").write(h.replace("</head>", fix + "</head>", 1))

          open(f"{m}/res/drawable/ic_bg.xml", "w").write('<vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108"><path android:fillColor="#D0603F" android:pathData="M0,0h108v108h-108z"/><path android:fillColor="#B84324" android:pathData="M0,68 C36,56 72,80 108,64 L108,108 L0,108 Z"/></vector>')
          open(f"{m}/res/drawable/ic_fg.xml", "w").write('<vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108"><path android:fillColor="#F8F4F4" android:pathData="M24,72 L44,38 L58,60 L66,46 L84,72 Z"/><path android:strokeColor="#D0603F" android:strokeWidth="4.5" android:strokeLineCap="round" android:pathData="M44,73 Q53,62 47,54 Q42,47 52,40"/><path android:fillColor="#FFE0D9" android:pathData="M66,30 C61.5,30 58,33.5 58,38 C58,44 66,52 66,52 C66,52 74,44 74,38 C74,33.5 70.5,30 66,30 Z"/></vector>')
          ic = '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@drawable/ic_bg"/><foreground android:drawable="@drawable/ic_fg"/><monochrome android:drawable="@drawable/ic_fg"/></adaptive-icon>'
          open(f"{m}/res/mipmap-anydpi-v26/ic_launcher.xml", "w").write(ic)
          open(f"{m}/res/mipmap-anydpi-v26/ic_launcher_round.xml", "w").write(ic)

          open(f"{b}/settings.gradle.kts", "w").write('pluginManagement{repositories{google();mavenCentral();gradlePluginPortal()}}\ndependencyResolutionManagement{repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS);repositories{google();mavenCentral()}}\nrootProject.name="BalkanRoute"\ninclude(":app")')
          open(f"{b}/gradle.properties", "w").write("android.useAndroidX=true\norg.gradle.jvmargs=-Xmx4096m\n")
          open(f"{b}/build.gradle.kts", "w").write('plugins{id("com.android.application") version "8.7.3" apply false;id("org.jetbrains.kotlin.android") version "2.0.21" apply false}')
          open(f"{b}/app/build.gradle.kts", "w").write('plugins{id("com.android.application");id("org.jetbrains.kotlin.android")}\nandroid{namespace="com.balkanroute.app";compileSdk=35;defaultConfig{applicationId="com.balkanroute.app";minSdk=29;targetSdk=35;versionCode=7;versionName="1.6"};buildTypes{release{isMinifyEnabled=false;signingConfig=signingConfigs.getByName("debug")}};compileOptions{sourceCompatibility=JavaVersion.VERSION_17;targetCompatibility=JavaVersion.VERSION_17};kotlinOptions{jvmTarget="17"}}\ndependencies{implementation("androidx.core:core-ktx:1.15.0");implementation("androidx.activity:activity-ktx:1.10.0");implementation("androidx.webkit:webkit:1.12.1")}')
          open(f"{m}/res/values/themes.xml", "w").write('<resources><style name="Theme.BalkanRoute" parent="android:Theme.Material.NoActionBar"><item name="android:statusBarColor">@android:color/transparent</item><item name="android:navigationBarColor">@android:color/transparent</item><item name="android:enforceStatusBarContrast">false</item><item name="android:enforceNavigationBarContrast">false</item><item name="android:windowLayoutInDisplayCutoutMode">shortEdges</item></style></resources>')
          open(f"{m}/AndroidManifest.xml", "w", encoding="utf-8").write('<manifest xmlns:android="http://schemas.android.com/apk/res/android"><uses-permission android:name="android.permission.INTERNET"/><uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/><uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/><uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/><application android:allowBackup="true" android:usesCleartextTraffic="true" android:hardwareAccelerated="true" android:enableOnBackInvokedCallback="true" android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher_round" android:label="Балканы" android:theme="@style/Theme.BalkanRoute"><activity android:name=".MainActivity" android:configChanges="orientation|screenSize|screenLayout|keyboardHidden|uiMode" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>')

          kt = '''package com.balkanroute.app
          import android.Manifest
          import android.annotation.SuppressLint
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.graphics.Color
          import android.net.Uri
          import android.os.Bundle
          import android.view.HapticFeedbackConstants
          import android.view.ViewGroup
          import android.webkit.*
          import androidx.activity.*
          import androidx.core.app.ActivityCompat
          import androidx.core.content.ContextCompat
          import androidx.core.view.*
          import androidx.webkit.*
          import java.io.ByteArrayInputStream
          import java.io.File
          import java.net.HttpURLConnection
          import java.net.URL

          class MainActivity : ComponentActivity() {
              private lateinit var wv: WebView
              private lateinit var cacheDir: File
              private var sTop = 38; private var sBot = 22
              private val rx = Regex("/(\\\\d+)/(\\\\d+)/(\\\\d+)(?:@2x)?\\\\.png$")

              private fun dl(u: String): ByteArray? = try {
                  val c = (URL(u).openConnection() as HttpURLConnection).apply {
                      connectTimeout = 8000; readTimeout = 8000
                      setRequestProperty("User-Agent", "Mozilla/5.0 (Linux; Android 16) Chrome/131.0.0.0 Mobile")
                  }
                  if (c.responseCode == 200) c.inputStream.use { it.readBytes() }.takeIf { it.size > 100 } else null
              } catch (_: Exception) { null }

              private fun intercept(ld: WebViewAssetLoader, req: WebResourceRequest): WebResourceResponse? {
                  val u = req.url; val h = u.host ?: ""; val p = u.path ?: ""
                  if (h == "appassets.androidplatform.net") {
                      return ld.shouldInterceptRequest(if (p == "/assets/" || p == "/assets") Uri.parse("https://appassets.androidplatform.net/assets/index.html") else u)
                  }
                  if (h.endsWith("openstreetmap.org") || h.endsWith("cartocdn.com")) {
                      val hdr = mapOf("Access-Control-Allow-Origin" to "*", "Cache-Control" to "public, max-age=2592000")
                      val m = rx.find(p)
                      val st = if (p.contains("dark_all")) "dark" else if (h.endsWith("openstreetmap.org")) "osm" else "voy"
                      if (m != null) {
                          val (z, x, y) = m.destructured
                          val f = File(cacheDir, "${st}_${z}_${x}_${y}.png")
                          if (f.exists() && f.length() > 100) return WebResourceResponse("image/png", null, 200, "OK", hdr, ByteArrayInputStream(f.readBytes()))
                          val fb = if (st == "dark") "https://a.basemaps.cartocdn.com/dark_all/$z/$x/$y@2x.png" else "https://a.basemaps.cartocdn.com/rastertiles/voyager/$z/$x/$y@2x.png"
                          val b = dl(u.toString()) ?: dl(fb)
                          if (b != null) {
                              try { f.writeBytes(b) } catch (_: Exception) {}
                              return WebResourceResponse("image/png", null, 200, "OK", hdr, ByteArrayInputStream(b))
                          }
                      }
                  }
                  return null
              }

              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  enableEdgeToEdge(SystemBarStyle.auto(0, 0), SystemBarStyle.auto(0, 0))
                  super.onCreate(savedInstanceState)
                  WindowCompat.setDecorFitsSystemWindows(window, false)
                  cacheDir = File(filesDir, "tiles").apply { mkdirs() }
                  if (ContextCompat.checkSelfPermission(this, Manifest.permission.ACCESS_FINE_LOCATION) != PackageManager.PERMISSION_GRANTED)
                      ActivityCompat.requestPermissions(this, arrayOf(Manifest.permission.ACCESS_FINE_LOCATION), 1)
                  val ld = WebViewAssetLoader.Builder().setDomain("appassets.androidplatform.net").addPathHandler("/assets/", WebViewAssetLoader.AssetsPathHandler(this)).build()
                  if (WebViewFeature.isFeatureSupported(WebViewFeature.SERVICE_WORKER_BASIC_USAGE)) {
                      ServiceWorkerControllerCompat.getInstance().setServiceWorkerClient(object : ServiceWorkerClientCompat() {
                          override fun shouldInterceptRequest(req: WebResourceRequest) = intercept(ld, req)
                      })
                  }
                  wv = WebView(this).apply {
                      layoutParams = ViewGroup.LayoutParams(-1, -1)
                      setBackgroundColor(Color.TRANSPARENT)
                      overScrollMode = WebView.OVER_SCROLL_NEVER
                      settings.apply {
                          javaScriptEnabled = true; domStorageEnabled = true; databaseEnabled = true
                          userAgentString = "Mozilla/5.0 (Linux; Android 16) Chrome/131.0.0.0 Mobile"
                          setGeolocationEnabled(true); setSupportZoom(false)
                      }
                      addJavascriptInterface(Bridge(), "AndroidBridge")
                      webViewClient = object : WebViewClient() {
                          override fun shouldInterceptRequest(v: WebView, r: WebResourceRequest) = intercept(ld, r)
                          override fun shouldOverrideUrlLoading(v: WebView, r: WebResourceRequest): Boolean {
                              if (r.url.toString().startsWith("https://appassets.androidplatform.net/")) return false
                              try { startActivity(Intent(Intent.ACTION_VIEW, r.url)) } catch (_: Exception) {}
                              return true
                          }
                          override fun onPageFinished(v: WebView, u: String) { insets() }
                      }
                      webChromeClient = object : WebChromeClient() {
                          override fun onGeolocationPermissionsShowPrompt(o: String, cb: GeolocationPermissions.Callback) = cb.invoke(o, true, false)
                      }
                  }
                  setContentView(wv)
                  ViewCompat.setOnApplyWindowInsetsListener(wv) { _, wi ->
                      val i = wi.getInsets(WindowInsetsCompat.Type.systemBars() or WindowInsetsCompat.Type.displayCutout())
                      val d = resources.displayMetrics.density
                      sTop = (i.top / d).toInt().coerceAtLeast(32); sBot = (i.bottom / d).toInt().coerceAtLeast(18)
                      insets(); WindowInsetsCompat.CONSUMED
                  }
                  onBackPressedDispatcher.addCallback(this, object : OnBackPressedCallback(true) {
                      override fun handleOnBackPressed() {
                          if (wv.canGoBack()) wv.goBack() else { isEnabled = false; onBackPressedDispatcher.onBackPressed(); isEnabled = true }
                      }
                  })
                  wv.loadUrl("https://appassets.androidplatform.net/assets/index.html")
              }

              private fun insets() = wv.evaluateJavascript("document.documentElement.style.setProperty('--safe-top','${sTop}px');document.documentElement.style.setProperty('--safe-bottom','${sBot}px');", null)

              inner class Bridge {
                  @JavascriptInterface fun onThemeChanged(t: String) = runOnUiThread {
                      WindowCompat.getInsetsController(window, window.decorView).apply {
                          isAppearanceLightStatusBars = t != "dark"; isAppearanceLightNavigationBars = t != "dark"
                      }
                  }
                  @JavascriptInterface fun haptic() = runOnUiThread { wv.performHapticFeedback(HapticFeedbackConstants.CLOCK_TICK) }
              }
          }'''
          open(f"{m}/java/com/balkanroute/app/MainActivity.kt", "w", encoding="utf-8").write(kt)

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: ./android_build
        run: |
          gradle assembleRelease
          cp app/build/outputs/apk/release/*.apk ../BalkanRoute-Android17.apk

      - uses: actions/upload-artifact@v4
        with:
          name: BalkanRoute-Android17-APK
          path: BalkanRoute-Android17.apk
